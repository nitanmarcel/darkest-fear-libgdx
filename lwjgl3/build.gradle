import io.github.fourlastor.construo.Target

plugins {
    id 'application'
    id 'io.github.fourlastor.construo' version '2.3.0'
}

dependencies {
    implementation project(':core')
    implementation project(':j2me')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:2.2.4"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"

    implementation "org.lwjgl:lwjgl-tinyfd:3.3.4"
    ["linux", "linux-arm64", "macos", "macos-arm64", "windows"].each {
        runtimeOnly "org.lwjgl:lwjgl-tinyfd:3.3.4:natives-$it"
    }

    implementation "io.github.spair:imgui-java-binding:$imguiVersion"
    implementation "io.github.spair:imgui-java-lwjgl3:$imguiVersion"
    implementation "io.github.spair:imgui-java-natives-linux:$imguiVersion"
    implementation "io.github.spair:imgui-java-natives-macos:$imguiVersion"
    implementation "io.github.spair:imgui-java-natives-windows:$imguiVersion"
}

sourceSets.main.resources.srcDirs += rootProject.file('assets')
processResources.exclude 'hs_err_pid*.log'

application {
    mainClass = 'darkestfear.lwjgl3.Lwjgl3Launcher'
}

run {
    workingDir = rootProject.file('assets')
    systemProperty 'darkestfear.debug', 'true'
}

jar {
    archiveFileName = 'DarkestFear.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**'
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

construo {
    name = 'DarkestFear'
    humanName = 'Darkest Fear'
    zipFolder = 'DarkestFear'

    def jdk = 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13.1%2B2/OpenJDK21U-jdk'
    targets.configure {
        create('linuxX64', Target.Linux) {
            architecture = Target.Architecture.X86_64
            jdkUrl = "${jdk}_x64_linux_hotspot_21.0.13.1_2.tar.gz"
            jdkSha256 = 'bb8a93f9ae6e7a693b2b721e85dbeff26ae1a77447985a8d7afcdd9c7cf6222e'
        }
        create('winX64', Target.Windows) {
            architecture = Target.Architecture.X86_64
            jdkUrl = "${jdk}_x64_windows_hotspot_21.0.13.1_2.zip"
            jdkSha256 = 'bbebea1469996b276683c9299c227b294f85c847039c82633218186a4ad4fbf2'
        }
        create('macX64', Target.MacOs) {
            architecture = Target.Architecture.X86_64
            jdkUrl = "${jdk}_x64_mac_hotspot_21.0.13.1_2.tar.gz"
            jdkSha256 = '1b5eff1741bb83d32e2e19aade71452bb42e40f047c01d3e178d438304c9a26d'
            identifier = 'io.github.nitanmarcel.darkestfear'
            buildNumber = appVersion
            versionNumber = appVersion
        }
        create('macM1', Target.MacOs) {
            architecture = Target.Architecture.AARCH64
            jdkUrl = "${jdk}_aarch64_mac_hotspot_21.0.13.1_2.tar.gz"
            jdkSha256 = '48067f2b7c958ed104a9d8a5749be7d25220b0a356b4d2d1bcfaab3e16ad0b14'
            identifier = 'io.github.nitanmarcel.darkestfear'
            buildNumber = appVersion
            versionNumber = appVersion
        }
    }
}
