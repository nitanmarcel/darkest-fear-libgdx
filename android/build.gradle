plugins {
    id 'com.android.application'
}

android {
    namespace 'darkestfear.android'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.nitanmarcel.darkestfear'
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName appVersion
    }

    signingConfigs {
        release {
            if (project.hasProperty('DF_KEYSTORE')) {
                storeFile file(DF_KEYSTORE)
                storePassword DF_KEYSTORE_PASSWORD
                keyAlias DF_KEY_ALIAS
                keyPassword DF_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('DF_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += 'ttf'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            assets.srcDirs = [rootProject.file('assets')]
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation project(':j2me')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-android:2.2.4"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.jakewharton.android.repackaged:dalvik-dx:16.0.1"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}

tasks.register('copyAndroidNatives') {
    doFirst {
        configurations.natives.copy().files.each { jar ->
            def abi = null
            if (jar.name.endsWith('natives-armeabi-v7a.jar')) abi = 'armeabi-v7a'
            if (jar.name.endsWith('natives-arm64-v8a.jar')) abi = 'arm64-v8a'
            if (jar.name.endsWith('natives-x86.jar')) abi = 'x86'
            if (jar.name.endsWith('natives-x86_64.jar')) abi = 'x86_64'
            if (abi != null) {
                def outDir = file("libs/$abi")
                outDir.mkdirs()
                copy {
                    from zipTree(jar)
                    into outDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    it.dependsOn 'copyAndroidNatives'
}
